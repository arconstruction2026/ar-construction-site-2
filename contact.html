<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — AR Construction</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

<div data-site-shell="header"></div>
<section class="page-head page-head--light">
  <div class="wrap">
    <div>
      <div class="page-head__crumb"><a href="index.html">Home</a> / Contact</div>
      <h1>Let's Build Something Together</h1>
      <p>Reach out for project inquiries, tender discussions, or general questions.</p>
    </div>
    <div class="page-head__blueprint">
      <svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
        <!-- envelope -->
        <path class="bp-line" d="M20,60 L120,60 L120,130 L20,130 Z" style="animation-delay:.2s"/>
        <path class="bp-line" d="M20,60 L70,100 L120,60" style="animation-delay:.6s"/>
        <circle class="bp-dot" cx="20" cy="130" r="3" style="animation-delay:2.1s"/>

        <!-- location pin -->
        <path class="bp-line bp-line--amber" d="M215,150 Q215,115 180,115 Q145,115 145,150 Q145,180 180,220 Q215,180 215,150 Z" style="animation-delay:.4s"/>
        <circle class="bp-line" cx="180" cy="150" r="14" style="animation-delay:1.2s"/>
        <circle class="bp-dot" cx="180" cy="150" r="3" style="animation-delay:2.3s"/>

        <!-- phone -->
        <path class="bp-line" d="M250,50 L250,190 Q250,200 260,200 L285,200 Q295,200 295,190 L295,60 Q295,50 285,50 Z" style="animation-delay:.7s"/>
        <line class="bp-line" x1="260" y1="60" x2="285" y2="60" style="animation-delay:1.4s"/>
        <line class="bp-line bp-line--amber" x1="265" y1="188" x2="280" y2="188" style="animation-delay:1.6s"/>
      </svg>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="contact-grid reveal">

      <!-- NOTE: action points to Formspree — replace YOUR_FORM_ID with your own
           free endpoint from https://formspree.io so submissions reach your email. -->
      <form class="contact-form" action="https://formspree.io/f/meajader" method="POST">
        <div class="form-row">
          <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone">
          </div>
          <div class="form-field">
            <label for="company">Company / Institution</label>
            <input type="text" id="company" name="company">
          </div>
        </div>
        <div class="form-row">
          <div class="form-field full">
            <label for="type">Project Type</label>
            <select id="type" name="project_type">
              <option>Civil &amp; Infrastructure</option>
              <option>Irrigation &amp; Water Management</option>
              <option>Material Supply</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field full">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
        </div>
        <button type="submit" class="btn btn--solid">Send Inquiry <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>

      <div class="contact-photo-card">
        <img src="assets/Contact us.png" alt="AR Construction site work">
      </div>

    </div>

    <div class="contact-map contact-map--full reveal">
      <div class="contact-map__frame">
        <iframe src="https://www.google.com/maps?q=284+Bazaar+Street+7th+Lane+Sammanthurai+Sri+Lanka&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="AR Construction office location"></iframe>
      </div>
      <div class="contact-map__list">
        <div class="contact-map__loc">
          <span class="dot"></span>
          <div><strong>Head Office</strong><span>284, Bazaar Street 7th Lane, Sammanthurai — 05</span></div>
        </div>
        <div class="contact-map__loc">
          <span class="dot"></span>
          <div><strong>Phone</strong><span><a href="tel:+94751102922">+94 75 110 2922</a></span></div>
        </div>
        <div class="contact-map__loc">
          <span class="dot"></span>
          <div><strong>Email</strong><span><a href="mailto:info.arconstructionoffice@gmail.com">info.arconstructionoffice@gmail.com</a></span></div>
        </div>
        <!-- When a second office opens, duplicate the "Head Office" block above with its address to list it here. -->
      </div>
    </div>

  </div>
</section>

<script src="js/site-shell.js"></script>
  <script src="js/main.js"></script>
  <div data-site-shell="footer"></div>
</body>
</html>
